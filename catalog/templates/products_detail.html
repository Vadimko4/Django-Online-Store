{% extends 'base.html' %}
{% load my_tags %}
{% block content %}
<div class="row text-center">
    <div class="col-3">
        <div class="card mb-4 box-shadow">
            <div class="card-header">
                <h4 class="my-0 font-weight-normal">{{ product.name }}</h4>
            </div>
            <div class="card-body">
                <h1 class="card-title pricing-card-title">₽ {{ product.price }}</h1>
                <img src="{{ product.photo | media_filter }}" alt="{{ product.name }}" height="200">
                <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                    <li>Категория: {{ product.category }}</li>
                    <li>Описание: {{ product.description }}</li>
                    <li>Зарегистрирован: {{ product.created_at }}</li>
                    <li>Обновлён: {{ product.updated_at }}</li>
                </ul>
                <button type="button" class="btn btn-lg btn-block btn-outline-primary">Купить</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
