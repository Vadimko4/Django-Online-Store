<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Online-Store "Django"</h5>
    <nav class="ms-5">
        <ul class="nav">
            <li class="nav-item">
<!--                <a class="nav-link active" aria-current="page" href="/">Каталог</a>-->
                <div class="dropdown">
                    <button class="btn btn btn-link dropdown-toggle" style="border:none; background:none; text-decoration:none;" type="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                        Каталог товаров
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="nav-link active" href="/">Все категории</a></li>
                        {% for category in categories %}
                            <li><a class="nav-link active" href="{% url 'catalog:category_list' category.pk %}">{{ category.name}}</a></li>
                        {% endfor %}
                    </ul>
                </div>
            </li>
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/blog/">Блог</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/contacts/">Контакты</a>
            </li>
            {% if user.is_authenticated %}
            <form action="{% url 'users:logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-link" style="padding:10;
                margin-top:3px; border:none; background:none; text-decoration:none;">
                    Выход
                </button>
            </form>
            {% else %}
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{% url 'users:login' %}">Вход</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{% url 'users:register' %}">Регистрация</a>
            </li>
            {% endif %}
        </ul>
    </nav>
</div>
