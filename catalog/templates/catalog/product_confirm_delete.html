{% extends 'catalog/base.html' %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                  <p class="card-text">Действительно хотите удалить "{{ object.name }}"</p>
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="btn-group" role="group" aria-label="Basic example">
                            <button type="submit" class="btn btn-outline-primary">Удалить</button>
                            <a class="btn btn-outline-primary" href="{% url 'catalog:products_detail' product.pk %}" role="button">Отменить</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
