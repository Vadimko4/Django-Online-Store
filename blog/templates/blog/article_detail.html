{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}

<div class="row text-center">
    <h5 class="display-6 mb-5">Вы находитесь в разделе "БЛОГ"</h5>
    <div class="col-1"></div>
    <div class="col-10">
        <div class="card mb-4 box-shadow">
            <div class="card-header">
                <h4 class="my-0 font-weight-normal">{{ object.title }}</h4>
            </div>
            <div class="card-body">
                <img src="{{ object.preview | media_filter }}" alt="photo" height="400"
                     style="float: left; margin-right: 10px; margin-left: 10px;">
                <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                    <li>{{ object.content }}</li>
                </ul>

                <div class="d-flex justify-content-between align-items-center">
                    <div class="btn-group" role="group" aria-label="Basic example">
                        <a class="btn btn-outline-primary" href="{% url 'blog:article_list' %}" role="button">Назад</a>
                        <a class="btn btn-outline-primary" href="{% url 'blog:article_update' article.pk %}"
                           role="button">Изменить</a>
                        <a class="btn btn-outline-primary" href="{% url 'blog:article_delete' article.pk %}"
                           role="button">Удалить</a>
                    </div>
                    <small class="text-muted">просмотров: {{ object.views_counter }}</small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
